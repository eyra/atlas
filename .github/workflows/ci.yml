name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  beam:
    name: Bus, State, Control
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: beam
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix atlas.gen --check
      - run: mix test

  tui:
    name: TUI
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: clients/tui
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test
