name: CI

on:
  push:
    branches: [develop, master]
  pull_request:

jobs:
  beam:
    name: Bus, State, Control
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: beam
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix atlas.gen --check
      - run: mix test

  tui:
    name: TUI
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: clients/tui
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test

  e2e:
    name: End to end (rela, core, two TUIs)
    runs-on: ubuntu-latest
    env:
      TERM: xterm-256color
      ATLAS_E2E_RELA_BIN: ${{ github.workspace }}/.rela-bin
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      - run: sudo apt-get update && sudo apt-get install -y tmux lsof netcat-openbsd jq
      # rela-server, pinned in rela/scripts/start-test.sh; it downloads it when missing.
      - uses: actions/cache@v4
        with:
          path: .rela-bin
          key: rela-26.10.14-linux_amd64
      - run: mix compile --warnings-as-errors && mix format --check-formatted
        working-directory: e2e
      # bin/atlas itself: prod by default, test only when asked, e2e never on prod.
      - run: mix test
        working-directory: e2e
      - run: bin/atlas e2e --env test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screens
          path: e2e/artifacts
