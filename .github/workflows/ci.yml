name: CI

on:
  push:
    branches: [develop, master]
  pull_request:

jobs:
  generator:
    name: Spec generator on its own
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: bff/generator
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      - name: The generator holds none of Atlas's values
        run: |
          if grep -rniE 'AtlasBFFContract|AtlasControl|AtlasTui|submit_to|cancel_to|confirm_to|\.\./contract|bff/contract|"0\.2\.0"' lib test mix.exs; then
            echo "::error::bff/generator mentions Atlas's contract. Keep Atlas's values in bff/contract."
            exit 1
          fi
      # Compiled and tested without bff/contract, on a neutral example contract.
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test --warnings-as-errors

  contract:
    name: Contract and its file targets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bff/contract
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      # Fails when a file in bff/targets differs from what the contract generates, or is left over.
      - run: mix atlas.gen --check

  beam:
    name: Bus, State, Control
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: beam
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test

  tui:
    name: TUI
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: clients/tui
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test

  agent:
    name: Agents' command line and plan loader
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      - run: mix compile --warnings-as-errors && mix format --check-formatted && mix test
        working-directory: clients/agent
      # The loader compiles the client too; its tests read SCENES.md's layout.
      - run: mix compile --warnings-as-errors && mix format --check-formatted && mix test
        working-directory: tools/plan

  e2e:
    name: End to end (rela, core, two TUIs)
    runs-on: ubuntu-latest
    # DIAGNOSTICS (IS-Atlas-80, temporary): six runs side by side, logs always kept.
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5, 6]
    env:
      TERM: xterm-256color
      ATLAS_E2E_RELA_BIN: ${{ github.workspace }}/.rela-bin
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      - run: sudo apt-get update && sudo apt-get install -y tmux lsof netcat-openbsd jq
      # rela-server, pinned in rela/scripts/start-test.sh; it downloads it when missing.
      - uses: actions/cache@v4
        with:
          path: .rela-bin
          key: rela-26.10.14-linux_amd64
      - run: mix compile --warnings-as-errors && mix format --check-formatted
        working-directory: e2e
      # bin/atlas itself: prod by default, test only when asked, e2e never on prod.
      - run: mix test
        working-directory: e2e
      - run: bin/atlas e2e --env test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screens-${{ matrix.run }}
          path: e2e/artifacts

  # A merge to develop deploys test on Fly (d-0014, IS-Atlas-26): rela first, then the core,
  # once every check above passed; then a smoke check against the deployed test, over
  # test's private network. Each app has its own deploy token (fly tokens create deploy).
  deploy-test:
    name: Deploy test on Fly, and a smoke check
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [generator, contract, beam, tui, agent, e2e]
    runs-on: ubuntu-latest
    # One deploy at a time; a newer merge waits for the running one.
    concurrency:
      group: fly-deploy-test
      cancel-in-progress: false
    env:
      LABEL: develop-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: sudo apt-get update && sudo apt-get install -y lsof netcat-openbsd jq
      - name: The deploy tokens are there
        env:
          RELA: ${{ secrets.FLY_API_TOKEN_TEST_RELA }}
          CORE: ${{ secrets.FLY_API_TOKEN_TEST }}
        run: |
          [ -n "$RELA" ] || { echo "::error::Add the secret FLY_API_TOKEN_TEST_RELA (fly tokens create deploy -a eyra-atlas-test-rela)"; exit 1; }
          [ -n "$CORE" ] || { echo "::error::Add the secret FLY_API_TOKEN_TEST (fly tokens create deploy -a eyra-atlas-test)"; exit 1; }
      - name: Deploy rela (eyra-atlas-test-rela)
        run: flyctl deploy . --config fly/test/rela.toml --dockerfile fly/rela.Dockerfile --remote-only --ha=false --image-label "$LABEL"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_TEST_RELA }}
      - name: Deploy the core (eyra-atlas-test)
        run: flyctl deploy . --config fly/test/core.toml --dockerfile fly/core.Dockerfile --remote-only --ha=false --image-label "$LABEL"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_TEST }}
      # Reads only: the deployed build, Control over WireGuard, every kind through State and rela.
      - name: Smoke check against the deployed test
        run: fly/smoke.sh test "$LABEL"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_TEST }}
