name: Reviewed one-off production backup
on:
  pull_request:
    paths:
      - 'tools/prod-backup/**'
      - '.github/workflows/prod-backup.yml'
  push:
    tags: ['atlas-prod-backup-*']
env:
  ELIXIR_ERL_OPTIONS: '+S 1:1'
permissions:
  contents: read
jobs:
  private-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.18'
      - run: python3 -m unittest discover -s tools/prod-backup -v
  backup:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/atlas-prod-backup-')
    needs: private-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: fly-deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.18'
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: sudo apt-get update && sudo apt-get install -y jq
      # Only an operator-pushed full-SHA tag after independent review admits this job.
      # PR creation cannot access these credentials or mutate production.
      - name: Quiescent backup through existing scoped credentials
        env:
          ATLAS_FLY_TOKEN_CORE: ${{ secrets.FLY_API_TOKEN_PROD }}
          ATLAS_FLY_TOKEN_RELA: ${{ secrets.FLY_API_TOKEN_PROD_RELA }}
        run: |
          export ATLAS_BACKUP_FLY="$(command -v flyctl)"
          python3 tools/prod-backup/backup.py --output "$RUNNER_TEMP/atlas-backup"
      - name: Retain bounded proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-backup-proof
          path: |
            ${{ runner.temp }}/atlas-backup/proof.json
            ${{ runner.temp }}/atlas-backup/failure.json
          if-no-files-found: error
      # Never upload archive/data/private diagnostics or environment files: public repo.
