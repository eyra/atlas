# rela of Atlas test on Fly (IS-Atlas-26). Deployed from the repository root by CI on a
# merge to develop: fly deploy . --config fly/test/rela.toml --dockerfile fly/rela.Dockerfile
# No [[services]] and no public address: only test's own private network (eyra-atlas-test)
# reaches it, which the core and admitted devices join.
app = "eyra-atlas-test-rela"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[env]
  ATLAS_ENV = "test"

[mounts]
  source = "rela_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[checks.rela]
  type = "http"
  port = 7690
  path = "/api/v1/_schema"
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"
