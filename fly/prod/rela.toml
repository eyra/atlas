# rela of Atlas prod on Fly (IS-Atlas-79). Deployed from the repository root by CI on a
# merge to master: fly deploy . --config fly/prod/rela.toml --dockerfile fly/rela.Dockerfile
# No [[services]] and no public address: only prod's own private network (eyra-atlas-prod)
# reaches it, which the core and admitted devices join.
app = "eyra-atlas-rela"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[env]
  ATLAS_ENV = "prod"
  ATLAS_RELA_PORT = "7590"

[mounts]
  source = "rela_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "performance-1x"
  memory = "2048mb"

[checks.rela]
  type = "http"
  port = 7590
  path = "/api/v1/_schema"
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"
